[workspace]
resolver = "3"
members = [
    "apps/supervisor",
    "apps/capture-agent",
    "apps/uploader",
    "apps/browser-host",
    "apps/server",
    "apps/desktop-ui",
    "crates/core-types",
    "crates/config",
    "crates/ipc",
    "crates/event-bus",
    "crates/input-win",
    "crates/window-win",
    "crates/uia-win",
    "crates/capture-win",
    "crates/browser-events",
    "crates/clipboard-win",
    "crates/file-events-win",
    "crates/privacy",
    "crates/correlator",
    "crates/session",
    "crates/spool",
    "crates/archive",
    "crates/crypto",
    "crates/upload-client",
    "crates/diagnostics",
    "crates/test-support",
    "tests/harness-app",
    "tests/e2e-runner",
    "tests/tier1-feature",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Trajectory Recorder Engineering Team"]
license = "Proprietary"
repository = "https://github.com/company/trajectory-recorder"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal Workspace Crates
core-types = { path = "crates/core-types" }
config = { path = "crates/config" }
ipc = { path = "crates/ipc" }
event-bus = { path = "crates/event-bus" }
input-win = { path = "crates/input-win" }
window-win = { path = "crates/window-win" }
uia-win = { path = "crates/uia-win" }
capture-win = { path = "crates/capture-win" }
browser-events = { path = "crates/browser-events" }
clipboard-win = { path = "crates/clipboard-win" }
file-events-win = { path = "crates/file-events-win" }
privacy = { path = "crates/privacy" }
correlator = { path = "crates/correlator" }
session = { path = "crates/session" }
spool = { path = "crates/spool" }
archive = { path = "crates/archive" }
crypto = { path = "crates/crypto" }
upload-client = { path = "crates/upload-client" }
diagnostics = { path = "crates/diagnostics" }
test-support = { path = "crates/test-support" }
harness-app = { path = "tests/harness-app" }
server = { path = "apps/server" }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Async & Concurrency
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
arc-swap = "1.7"
futures = "0.3"
async-trait = "0.1"
bytes = "1.7"
dashmap = "6.0"

# Storage & Archive
rusqlite = { version = "0.32", features = ["bundled", "backup", "chrono", "uuid"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate"] }
object_store = { version = "0.11", features = ["aws"] }
zstd = "0.13"
tar = "0.4"

# Cryptography
chacha20poly1305 = { version = "0.10", features = ["alloc", "rand_core"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
hex = "0.4"
jsonwebtoken = "9.3"
base64 = "0.22"

# Networking & HTTP
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }
dotenvy = "0.15"

# Diagnostics & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"
thiserror = "2.0"
anyhow = "1.0"
sysinfo = "0.30"

# File System & Regex
notify = "6.1"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

# Windows Service (Platform Specific)
windows-service = "0.7"

# Testing & Utilities
tempfile = "3.12"
proptest = "1.5"

# Windows API (Platform Specific)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Media_MediaFoundation",
] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
overflow-checks = false

[profile.bench]
opt-level = 3
debug = false
