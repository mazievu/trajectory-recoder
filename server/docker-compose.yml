services:
  # Development-only convenience dependency. It is deliberately excluded from
  # the default (production) compose stack because it exposes plaintext S3.
  postgres:
    image: postgres:16-alpine
    container_name: trajectory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    profiles: ["development-only"]
    container_name: trajectory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trajectory-server
    environment:
      DEPLOYMENT_ROLE: ${DEPLOYMENT_ROLE:?set DEPLOYMENT_ROLE=server}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?set an HTTPS S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?set ENROLLMENT_TOKEN}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:?set DASHBOARD_API_TOKEN}
    depends_on:
      - postgres

  proxy:
    image: caddy:2.10-alpine
    container_name: trajectory-proxy
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/caddy/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/caddy/tls/tls.key:ro
    depends_on:
      - server

volumes:
  pgdata:
  miniodata:
