version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trajectory-postgres
    environment:
      POSTGRES_DB: trajectory_recorder
      POSTGRES_USER: trajectory_user
      POSTGRES_PASSWORD: trajectory_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: trajectory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trajectory-server
    environment:
      DATABASE_URL: postgres://trajectory_user:trajectory_password@postgres:5432/trajectory_recorder
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: trajectory-chunks
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  miniodata:
