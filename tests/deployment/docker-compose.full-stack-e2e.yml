# Disposable, local-only production-like verification stack. It never reads a
# deployment/server.env file and its credentials are test-fixture values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - trajectory-e2e-postgres:/var/lib/postgresql/data
      - ../../server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - trajectory-e2e-minio:/data
      - ${E2E_CERT_DIR:?set E2E_CERT_DIR}:/root/.minio/certs:ro

  minio-init:
    image: minio/mc:RELEASE.2024-07-26T13-08-44Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempt=0
        until mc alias set --insecure e2e https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
            attempt=$$((attempt + 1))
          test "$$attempt" -lt 60 || {
            echo "MinIO did not accept its configured HTTPS credentials after $$attempt attempts" >&2
            exit 1
          }
          sleep 1
        done
        mc mb --ignore-existing --insecure "e2e/$$S3_BUCKET" >/dev/null

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      DEPLOYMENT_ROLE: ${DEPLOYMENT_ROLE:?set DEPLOYMENT_ROLE=server}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      S3_ENDPOINT: https://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?set ENROLLMENT_TOKEN}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:?set DASHBOARD_API_TOKEN}
      S3_CA_CERT_PATH: /run/trajectory-e2e-certs/ca.crt
    volumes:
      - ${E2E_CERT_DIR:?set E2E_CERT_DIR}/ca.crt:/run/trajectory-e2e-certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  proxy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    ports:
      - "127.0.0.1:${E2E_PROXY_PORT:-8443}:443"
    volumes:
      - ../../server/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${E2E_CERT_DIR:?set E2E_CERT_DIR}/public.crt:/etc/caddy/tls/tls.crt:ro
      - ${E2E_CERT_DIR:?set E2E_CERT_DIR}/private.key:/etc/caddy/tls/tls.key:ro
    depends_on:
      - server

volumes:
  trajectory-e2e-postgres:
  trajectory-e2e-minio:
