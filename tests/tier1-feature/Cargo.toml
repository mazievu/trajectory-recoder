[package]
name = "tier1-feature"
version = "0.1.0"
edition = "2024"
authors = ["Trajectory Recorder QA Team"]
description = "Tier 1 Feature Coverage Test Suite for Trajectory Recorder"

[lib]
name = "tier1_feature"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
tempfile = "3.12"
regex = "1.10"
e2e-runner = { path = "../e2e-runner" }
harness-app = { path = "../harness-app" }
browser-events = { path = "../../crates/browser-events" }
spool = { path = "../../crates/spool" }
archive = { path = "../../crates/archive" }
upload-client = { path = "../../crates/upload-client" }
session = { path = "../../crates/session" }
privacy = { path = "../../crates/privacy" }
correlator = { path = "../../crates/correlator" }
core-types = { path = "../../crates/core-types" }
zstd = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

